<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Ticket - Railway Reservation System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Railway Reservation System</h1>
    <div class="auth-buttons">
        <a href="index.html">Home</a>
    </div>
</header>

<div class="form-container">
    <h2>Book Ticket</h2>
    <form action="book_ticket.php" method="POST">

        <label>Select Train</label>
        <select name="train_id" required>
    <option value="">-- Select Train --</option>
    <option value="1">Express 101 (Mumbai → Pune)</option>
    <option value="2">Superfast 102 (Nagpur → Delhi)</option>
    <option value="3">Passenger 103 (Chennai → Bangalore)</option>
</select>


        <label>Date of Journey</label>
        <input type="date" name="journey_date" required>

        <label>Passenger Name</label>
        <input type="text" name="passenger_name" placeholder="Passenger Full Name" required>

        <label>Age</label>
        <input type="number" name="passenger_age" placeholder="Age" required>

        <label>Gender</label>
        <select name="passenger_gender" required>
            <option value="">-- Select Gender --</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>

        <button type="submit">Book Ticket</button>
    </form>
</div>

</body>
</html>
